<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    
    <!-- Linked CSS --> <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <!-- Formulario de Insert nos Games -->
    <form class="form" id="form">
        <input type="text" id="inputTitulo" placeholder="Titulo" required>
        <input type="text" id="inputPreco" placeholder="Preço"   required>
        <input type="text" id="inputPlataforma"
        placeholder="Plataforma" required>
        <input type="text" id="inputAnoLancamento" placeholder="Ano de Lançamento" min="1970" max="2026" required>
        <input type="text" id="inputFaixaEtaria" placeholder="Faixa Etaria" required>
        <input type="text" id="inputGenero" placeholder="Gênero" required>
        <input type="text" id="inputDesenvolvedora" placeholder="Desenvolvedora" required>
        <div class="checkbox"><input type="checkbox" id="isMultiplayer" value="true">Multiplayer</div>
        <button type="button" id="submitButton">Enviar Dados</button>
    </form>

    <!-- Lista de Games Cadastrados -->
     <section class="games-cadastrados">

     </section>
</main>

<!-- Lista de Games Cadastrados -->
<script>

    const form = document.getElementById("form")
    const inputs = form.querySelectorAll("input")

    const inputTitulo         = document.getElementById("inputTitulo")
    const inputPreco          = document.getElementById("inputPreco")
    const inputPlataforma     = document.getElementById("inputPlataforma")
    const inputAnoLancamento  = document.getElementById("inputAnoLancamento")
    const inputFaixaEtaria    = document.getElementById("inputFaixaEtaria") 
    const inputGenero         = document.getElementById("inputGenero") 
    const inputDesenvolvedora = document.getElementById("inputDesenvolvedora") 
    const multiplayer         = document.getElementById("isMultiplayer")
    const submitButton        = document.getElementById("submitButton") 

    submitButton.addEventListener("click", enviarDados)

    // Insert Into in DataBase
    async function enviarDados () {
        if (!form.reportValidity()) return 
        const response = await fetch("http://localhost:3000/database", {
            method : "POST",
            headers : {
                'Content-Type' : 'application/json; charset=UTF-8',
            },
            body : JSON.stringify({
                titulo         : inputTitulo.value,
                preco          : inputPreco.value,
                plataforma     : inputPlataforma.value,
                anoLancamento  : inputAnoLancamento.value,
                faixaEtaria    : inputFaixaEtaria.value,
                genero         : inputGenero.value,
                desenvolvedora : inputDesenvolvedora.value,
                isMultiplayer  : multiplayer.checked
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log(data)
            clearFields()
        })
        
    }

    // Function to Clear Fields
    function clearFields () {
        inputs.forEach(input => {
                input.value = ""
        });
    }

</script>
</body>
</html>
